services:
  mariadb:
    image: mariadb
    container_name: schooltool-db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    env_file: .env.prod
    expose:
      - '3306'
    volumes:
      - db_data:/var/lib/mysql

  back:
    build:
      context: ./back
      target: prod
    container_name: schooltool-back
    restart: always
    env_file: .env.prod
    expose:
      - '80'
    depends_on:
      - mariadb

  auth:
    build:
      context: ./auth
      target: prod
    container_name: schooltool-auth
    restart: always
    env_file: .env.prod
    expose:
      - '80'
    depends_on:
      - mariadb

  front:
    build:
      context: ./front
      target: prod
    container_name: schooltool-front
    restart: always
    ports:
      - '80:80'
    depends_on:
      - back
      - auth

volumes:
  db_data:

networks:
  default:
    name: schooltool-net
